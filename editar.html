<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar Ferreira Laranjeira</title>
<style>body{font-family:Arial,sans-serif;background:#0b0b0b;color:#eee;max-width:900px;margin:auto;padding:30px}h1{font-family:Georgia,serif;color:#f0ca78}.box{border:1px solid #292929;padding:22px;margin:18px 0;background:#111}label{display:block;margin:14px 0 6px;color:#f0ca78}input,textarea{width:100%;box-sizing:border-box;background:#090909;border:1px solid #444;color:#fff;padding:12px;border-radius:4px}textarea{min-height:90px;resize:vertical}.btn{background:#c99a45;border:0;padding:13px 20px;margin:10px 8px 0 0;cursor:pointer;font-weight:bold}.note{color:#aaa;line-height:1.6}.ok{color:#8fd694}</style></head><body>
<h1>Editor — Ferreira Laranjeira</h1><p class="note">Edite os textos abaixo. Depois clique em <b>Gerar arquivo</b>. O arquivo <code>conteudo.js</code> será baixado. Substitua o <code>conteudo.js</code> do seu repositório do GitHub por ele para publicar as alterações.</p>
<form id="form"></form><button class="btn" onclick="gerar();return false">Gerar arquivo conteudo.js</button><button class="btn" onclick="salvar();return false">Salvar neste computador</button><p id="msg" class="ok"></p>
<script src="conteudo.js"></script><script>
const campos={brand:'Marca curta',eyebrow:'Texto pequeno da capa',heroTexto:'Texto principal da capa',botaoHero:'Botão da capa',historiaEyebrow:'Texto pequeno — História',historiaTitulo:'Título da História',historiaTexto:'Texto da História',valoresEyebrow:'Texto pequeno — Valores',valoresTitulo:'Título dos Valores',tradicaoTitulo:'Título — Tradição',tradicaoTexto:'Texto — Tradição',propositoTitulo:'Título — Propósito',propositoTexto:'Texto — Propósito',futuroTitulo:'Título — Futuro',futuroTexto:'Texto — Futuro',frase:'Frase de destaque',fraseAutor:'Autor da frase',contatoEyebrow:'Texto pequeno — Contato',contatoTitulo:'Título do Contato',contatoTexto:'Texto do Contato',email:'E-mail',botaoContato:'Botão de contato',rodape:'Rodapé'};
const f=document.getElementById('form'); for(const [k,l] of Object.entries(campos)){let label=document.createElement('label');label.textContent=l;f.appendChild(label);let el=document.createElement(k.includes('Texto')||k==='frase'||k==='rodape'?'textarea':'input');el.id=k;el.value=CONTEUDO[k]||'';f.appendChild(el)}
function get(){let o={};for(const k of Object.keys(campos))o[k]=document.getElementById(k).value;return o}
function salvar(){localStorage.setItem('FL_CONTEUDO',JSON.stringify(get()));document.getElementById('msg').textContent='Salvo neste computador.'}
function gerar(){let o=get();let txt='const CONTEUDO = '+JSON.stringify(o,null,2)+';\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));a.download='conteudo.js';a.click();document.getElementById('msg').textContent='Arquivo conteudo.js gerado. Agora envie esse arquivo para o GitHub.'}
</script></body></html>
