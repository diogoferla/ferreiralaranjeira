<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ferreira Laranjeira — tradição, propósito e futuro.">
<title>Ferreira Laranjeira</title>
<script src="conteudo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="site.js"></script>
<style>
:root{--gold:#c99a45;--gold2:#f0ca78;--black:#080808;--soft:#121212;--text:#eee;--muted:#aaa}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Georgia,'Times New Roman',serif;background:var(--black);color:var(--text);line-height:1.6}a{text-decoration:none;color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
.brand{font-size:18px;letter-spacing:4px;color:var(--gold2)}.links{display:flex;gap:30px;font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase}.links a:hover{color:var(--gold2)}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:110px 20px 70px;background:radial-gradient(circle at 50% 45%,#221a0d 0%,#0a0a0a 38%,#050505 72%)}
.hero img{width:min(620px,90vw);filter:drop-shadow(0 20px 35px rgba(0,0,0,.7));margin-bottom:5px}.eyebrow{font-family:Arial,sans-serif;letter-spacing:6px;text-transform:uppercase;color:var(--gold);font-size:11px}.hero p{max-width:650px;margin:20px auto 32px;color:#c9c9c9;font-size:18px}.btn{display:inline-block;border:1px solid var(--gold);padding:13px 28px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);transition:.25s}.btn:hover{background:var(--gold);color:#111}
section{padding:100px 8%;max-width:1200px;margin:auto}.dark{background:#0b0b0b}.section-title{text-align:center;font-size:42px;font-weight:normal;margin-bottom:18px}.line{width:70px;height:1px;background:var(--gold);margin:0 auto 35px}.intro{text-align:center;max-width:750px;margin:auto;color:var(--muted);font-size:17px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:55px}.card{border:1px solid #292929;padding:38px 28px;text-align:center;background:linear-gradient(145deg,#111,#0a0a0a)}.icon{font-size:26px;color:var(--gold2);margin-bottom:16px}.card h3{font-size:22px;font-weight:normal;margin-bottom:10px}.card p{color:var(--muted);font-size:14px;font-family:Arial,sans-serif}
.quote{padding:120px 8%;text-align:center;background:linear-gradient(rgba(8,8,8,.92),rgba(8,8,8,.96)),url('logo.png') center/cover fixed}.quote blockquote{font-size:32px;max-width:800px;margin:auto;font-style:italic}.quote cite{display:block;margin-top:20px;color:var(--gold);font-family:Arial,sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-style:normal}
.contact{text-align:center}.contact p{color:var(--muted);font-family:Arial,sans-serif;margin:10px auto 28px}.footer{border-top:1px solid #222;text-align:center;padding:30px 20px;color:#777;font-family:Arial,sans-serif;font-size:11px;letter-spacing:2px}
@media(max-width:700px){.links{display:none}.cards{grid-template-columns:1fr}.section-title{font-size:34px}.quote blockquote{font-size:24px}.hero img{width:95vw}}
</style>
</head>
<body>
<nav><div class="brand" id="brand"></div><div class="links"><a href="#historia">História</a><a href="#valores">Valores</a><a href="#contato">Contato</a></div></nav>
<header class="hero"><div><div class="eyebrow" id="heroEyebrow"></div><img src="logo.png" alt="Logo Ferreira Laranjeira"><p id="heroTexto"></p><a class="btn" href="#historia" id="botaoHero"></a></div></header>
<section id="historia"><div class="eyebrow" style="text-align:center" id="historiaEyebrow"></div><h2 class="section-title" id="historiaTitulo"></h2><div class="line"></div><p class="intro" id="historiaTexto"></p></section>
<section id="valores" class="dark"><div class="eyebrow" style="text-align:center" id="valoresEyebrow"></div><h2 class="section-title" id="valoresTitulo"></h2><div class="line"></div><div class="cards"><article class="card"><div class="icon">✦</div><h3 id="tradicaoTitulo"></h3><p id="tradicaoTexto"></p></article><article class="card"><div class="icon">◇</div><h3 id="propositoTitulo"></h3><p id="propositoTexto"></p></article><article class="card"><div class="icon">↗</div><h3 id="futuroTitulo"></h3><p id="futuroTexto"></p></article></div></section>
<div class="quote"><blockquote id="frase"></blockquote><cite id="fraseAutor"></cite></div>
<section id="contato" class="contact"><div class="eyebrow" id="contatoEyebrow"></div><h2 class="section-title" id="contatoTitulo"></h2><div class="line"></div><p id="contatoTexto"></p><a class="btn" id="botaoContato"></a></section>
<footer class="footer" id="rodape"></footer>
<script>
const ids = ['brand','heroEyebrow','heroTexto','botaoHero','historiaEyebrow','historiaTitulo','historiaTexto','valoresEyebrow','valoresTitulo','tradicaoTitulo','tradicaoTexto','propositoTitulo','propositoTexto','futuroTitulo','futuroTexto','frase','fraseAutor','contatoEyebrow','contatoTitulo','contatoTexto','botaoContato','rodape'];
ids.forEach(id => { const el=document.getElementById(id); if(el) el.textContent=CONTEUDO[id]; });
document.getElementById('botaoContato').href='mailto:'+CONTEUDO.email;
</script>
</body></html>
